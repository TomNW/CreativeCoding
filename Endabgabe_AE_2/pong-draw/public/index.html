<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Draw-Pong</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: #ffffff;
    }
    #scoreboard {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 20px;
    }
    #leftEdge, #rightEdge {
  position: fixed;
  top: 0;
  width: 20px;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#leftEdge {
  left: 0;
  background: blue;
}

#rightEdge {
  right: 0;
  background: red;
}

  </style>
  </head>
  <body>
  <div id="scoreboard">Links: 0 | Rechts: 0</div>
  <button id="startBtn" style="position: fixed; top: 50px; left: 50%; transform: translateX(-50%); padding: 10px 20px; font-size: 16px; display: none;">
  Spiel starten
  </button>
  <canvas id="gameCanvas"></canvas>
  <div id="leftEdge"></div>
  <div id="rightEdge"></div>
  <script src="main.js"></script>
  

</body>
</html>
